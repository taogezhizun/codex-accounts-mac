name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Privacy scan
        run: python3 scripts/privacy-check.py
      - name: Unit tests
        run: swift test
      - name: Build native app
        run: ./scripts/build-app.sh
      - name: Build and verify DMG installer
        run: |
          python3 -m venv dist/packaging-venv
          dist/packaging-venv/bin/pip install -r scripts/dmg-requirements.txt
          ./scripts/build-dmg.sh
          python3 scripts/verify-dmg.py "dist/Codex-Accounts-macOS-$(uname -m).dmg" "dist/Codex-Accounts-macOS-$(uname -m).zip"
